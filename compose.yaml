services:
  postgres:
    image: postgres:16
    container_name: harmony-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: harmony_discovery_explorer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harmony_discovery_explorer"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: harmony-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/harmony_discovery_explorer
      FRONTEND_ORIGIN: http://localhost:8080
      SECRET_KEY: ${SECRET_KEY:-local-compose-development-secret-change-me}
    ports:
      - "5001:5001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health/live')"
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: http://localhost:5001
    container_name: harmony-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
